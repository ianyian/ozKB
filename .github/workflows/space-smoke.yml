name: space-smoke
# End-to-end check of the deployed Space against Neon: reset, run the schedulers for two minutes,
# verify data flowed through every layer, then stop and reset so the demo starts clean.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy-space]
    types: [completed]
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      URL: https://yianxingjian-ozkb.hf.space
      KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Smoke test
        run: |
          set -e
          post() { b="$2"; [ -z "$b" ] && b='{}'; curl -sf -X POST -H "Content-Type: application/json" -H "x-admin-key: $KEY" "$URL$1" -d "$b"; echo; }
          for i in $(seq 1 30); do curl -sf "$URL/api/health" && break; sleep 10; done; echo
          post /api/admin/reset
          post /api/config '{"sim.events_per_tick": 4, "sim.interval_sec": 3, "demo.item_delay_ms": 50, "l1.batch_size": 12, "l2.batch_size": 10}'
          post /api/scheduler/all/start > /dev/null
          sleep 180
          post /api/scheduler/all/stop > /dev/null
          sleep 10
          curl -sf "$URL/api/dashboard" > d.json
          python3 - <<'EOF'
          import json
          d = json.load(open("d.json")); c = d["counts"]
          print("counts:", c); print("queue:", d["queue"]); print("cards by confidence:", d["tiers"])
          assert c["tickets"] > 10 and c["cards"] > 10 and c["commits"] > 5, "pipeline did not produce data"
          assert c["errors1h"] == 0, "errors were logged"
          print("SMOKE OK")
          EOF
          curl -sf -X POST -H "Content-Type: application/json" "$URL/api/ask" -d '{"q":"Which sites have label reprint control?"}' | python3 -c 'import json,sys; a=json.load(sys.stdin); print("ask:", a["type"], len(a["sources"]), "sources,", [s["tool"] for s in a["steps"]])'
          curl -sf "$URL/" | grep -q "Shopfloor Knowledge" && echo "portal page OK"
          curl -sf "$URL/ops/" | grep -q "KB Hub" && echo "ops page OK"
          curl -sf "$URL/api/search?q=label%20reprint" | python3 -c 'import json,sys; r=json.load(sys.stdin)["results"]; print("search:", len(r["cards"]), "cards,", len(r["code"]), "code,", len(r["docs"]), "docs")'
      - name: Restore default settings and load the full demo
        if: always()
        run: |
          post() { b="$2"; [ -z "$b" ] && b='{}'; curl -s -X POST -H "Content-Type: application/json" -H "x-admin-key: $KEY" "$URL$1" -d "$b"; echo; }
          post /api/scheduler/all/stop
          post /api/config '{"sim.events_per_tick": 2, "sim.interval_sec": 4, "demo.item_delay_ms": 250, "l1.batch_size": 12, "l2.batch_size": 10}'
          post /api/admin/load-full-demo '{"reset": true}'
          for i in $(seq 1 60); do
            s=$(curl -s "$URL/api/status" | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s["fast_forward"]["running"], s["sim"]["cursor"], s["sim"]["total"])')
            echo "loading: $s"; case "$s" in False*) break;; esac; sleep 15
          done
          curl -s "$URL/api/dashboard" | python3 -c 'import json,sys; print("full demo:", json.load(sys.stdin)["counts"])' 
